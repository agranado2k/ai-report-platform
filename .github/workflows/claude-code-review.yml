name: Claude Code Review

# Automated code review on every PR (Phase 0c.4 / ADR-030 — the Claude
# half of the dual AI-review setup; Gemini half lands separately).
#
# Auth uses `CLAUDE_CODE_OAUTH_TOKEN` (the GitHub App install token) — the
# same proven-working credential that drives the @claude mention bot in
# claude.yml. On a `pull_request` event there's no comment text to use as
# the instruction, so we pass an explicit `prompt:` telling the action to
# post a PR review with inline comments. The action posts review comments
# on the diff; it does NOT commit or push.
#
# permissions: pull-requests write to post the review; the rest read-only.
#
# CHECK SEMANTICS (issue #388, amends ADR-030 — the mirror of the #371 fix for
# the Gemini `review` check): the `claude-review` check is ADVISORY (it is NOT a
# required status check on `main` — AI review never gates merge), but it is
# fail-visibly. Green means a Claude review actually ran; red means it did not
# (quota/rate-limit 429, missing/invalid CLAUDE_CODE_OAUTH_TOKEN, overloaded 5xx,
# or the action failing), with the classified reason in the job summary. It is no
# longer allowed to report a false green when `continue-on-error` swallowed a
# failure. The gate is the classifier step at the end
# (scripts/classify-claude-review.sh, a shim over scripts/classify-ai-review.sh).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # write needed: posts the review comments
      issues: read
      # No id-token: the OIDC App-token exchange is bypassed by github_token,
      # and Anthropic auth uses the claude_code_oauth_token secret — neither
      # path needs OIDC, so we don't grant it.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # `continue-on-error` lets the job REACH the classifier step below even
        # when the review step exits non-zero (rate-limit 429, missing/invalid
        # auth, overloaded 5xx). It no longer decides the check's colour — the
        # classifier does (issue #388). Without a review actually running, this
        # check must not be green: a green `claude-review` check that proves
        # nothing defeats ADR-030's purpose (green must mean a review ran).
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post via the workflow's own GITHUB_TOKEN instead of minting a
          # GitHub App token through the OIDC exchange. The OIDC path runs a
          # "workflow file must be identical to the default branch" check,
          # which 401s on any PR that edits this workflow (and stalled the
          # whole review) — github_token sidesteps it entirely.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Force tag mode + a tracking comment so the review reliably attaches
          # to the PR on a pull_request event (no comment text to ride on).
          track_progress: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            First read CLAUDE.md, docs/adr/, and docs/diary.md for the ADRs and project state.
            Post a PR review with inline comments. Specifically flag: ADR-024 (no
            fp-ts/Effect/Remeda; vanilla TS in domain/application), ADR-013 (viewer
            security headers), ADR-014 (service-worker block at edge), Conventional
            Commits violations, and any drift from docs/db-design.md / the glossary.
          claude_args: |
            --max-turns 45
            --model claude-opus-5
        # --model: the wired reviewer takes a FULL model id (unlike the tier
        # mapping in scripts/agents.config.sh, whose in-session values are the
        # aliases the Agent tool's spawn accepts). claude-opus-4-8 ->
        # claude-opus-5 on 2026-09-21 (ADR-030 amendment): the current Opus
        # generation, chosen for the review's quality, not tied to any tier —
        # this workflow is the Anthropic action and stays single-vendor, while
        # the `reviewer` TIER (ADR-0084) is the cross-vendor one dispatched
        # from a session. Re-check against the Claude API model reference at
        # each housekeeping pass.
        # --max-turns raised 25 -> 45 (issue #394): a review that runs out of turns
        # is now classified TRUNCATED (green with a note) rather than lost, but a
        # higher budget makes truncation rare in the first place. 45 gives a
        # multi-file PR review room to read the ADRs + walk each changed file
        # without materially raising cost on a normal PR (the model stops when
        # done, well under the cap); it is a ceiling, not a target.

      - name: Enforce that a review actually ran
        # The gate for issue #388 (the #371 pattern; Claude-only since the Gemini
        # reviewer was retired in #394). Runs even when the review step failed
        # (`if: always()`), classifies WHY (quota / auth / missing / transient /
        # truncated / unknown), and exits non-zero for anything that is NOT a real
        # review, so THIS step — not `continue-on-error` above — decides the check
        # colour. A green `claude-review` check now means, and only means, that a
        # Claude review ran (possibly TRUNCATED at the turn cap — green with a
        # note); the reason for a red one lands in the job summary, with quota
        # distinguishable from auth.
        #
        # The check stays ADVISORY (ADR-030 — AI review never gates merge; it is
        # not a required status check on `main`), but "advisory" no longer means
        # "silently green when nothing happened": red-but-non-blocking is the
        # honest state a solo maintainer can act on (re-run, top up quota, or
        # merge without the AI-review signal for this run).
        #
        # The Claude action exposes NO `outputs.error` (unlike run-gemini-cli).
        # It exposes `outputs.conclusion` (success|failure) and
        # `outputs.execution_file` — a JSON array of the run's SDK messages. We
        # extract ONLY the error-bearing fields (the `type:"result"` events with
        # `is_error:true` — their subtype + result text), never the reviewed diff,
        # so the code under review cannot spoof a classification. The extracted
        # text is untrusted data (ADR-0069): it reaches the classifier through
        # stdin, never interpolated into the shell.
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude-review.outcome }}
          CLAUDE_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          err=""
          if [ -n "${CLAUDE_EXECUTION_FILE:-}" ] && [ -f "${CLAUDE_EXECUTION_FILE}" ]; then
            # @v1 writes this file as JSON.stringify(messages, null, 2) — a single
            # pretty-printed array. The `if type=="array" then .[] else . end`
            # prelude also tolerates an NDJSON shape (one object per line) without
            # `--slurp`, which would break the confirmed array case: default jq
            # reads the array as one value (iterated by `.[]`) or each NDJSON line
            # as its own value (used directly). Either way we select ONLY the
            # error-bearing result events, never the reviewed diff.
            err=$(jq -rn '
              [ inputs
                | (if type == "array" then .[] else . end)
                | select((.type == "result") and (.is_error == true))
                | ((.subtype // "") + " " + (.result // ""))
              ] | join("\n")
            ' "${CLAUDE_EXECUTION_FILE}" 2>/dev/null || true)
            # TRUNCATED signal (#394): on an `error_max_turns` truncation the
            # result event's `.result` is usually empty, so the error text alone
            # cannot tell a review that posted a partial result from one that
            # posted nothing. When the run hit the turn cap, check whether it
            # produced any assistant text (evidence a review body was posted) and,
            # if so, append the FIXED sentinel `AI_REVIEW_BODY_POSTED` — never the
            # model's own text, so the classified stream stays ADR-0069-clean and
            # the classifier's green/red decision keys on the sentinel ALONE. No
            # content → nothing appended → the classifier keeps it red. The grep
            # below MUST match TURNCAP_RE in scripts/classify-ai-review.sh.
            if printf '%s' "$err" | grep -qiE 'error_max_turns|maximum number of turns|max[ _-]?turns|reached.*turn limit'; then
              posted=$(jq -rn '
                [ inputs
                  | (if type == "array" then .[] else . end)
                  | select(.type == "assistant")
                  | (.message.content // [] | .[]? | select(.type == "text") | .text)
                ] | join("")
              ' "${CLAUDE_EXECUTION_FILE}" 2>/dev/null | tr -d '[:space:]' | wc -c | tr -d ' ')
              if [ "${posted:-0}" != "0" ]; then
                err="${err} AI_REVIEW_BODY_POSTED"
              fi
            fi
          fi
          # The action sets outputs.conclusion=failure even if it were to exit 0
          # with a swallowed is_error; fold that into the outcome the classifier
          # sees so that case can never read as a clean RAN.
          outcome="${CLAUDE_OUTCOME}"
          if [ "${CLAUDE_CONCLUSION:-}" = "failure" ]; then
            outcome="failure"
          fi
          printf '%s' "$err" | scripts/classify-claude-review.sh "$outcome"
