name: Preview data isolation

# Per-PR preview data plane (ADR-0047). On a PR opened/updated, fork an ephemeral
# Neon branch from prod head and point THIS PR's preview deployments at it via a
# git-branch-scoped Vercel DATABASE_URL, plus an R2 key prefix (pr-<N>/) so preview
# blobs are namespaced. On PR close, tear it all down.
#
# SOFT isolation (operator decision, ADR-0047): prod env vars remain as the preview
# fallback, so a preview built BEFORE this workflow finishes uses prod. We mitigate
# by failing LOUD here (a red check) if branch creation or env injection fails, and
# by triggering a redeploy so the isolated env takes effect. The DB is the hard
# boundary; R2 stays namespaced within the prod bucket.
#
# TRIGGER INVERSION (issue #149, 2026-07-09): this workflow is now also the
# entry point for the e2e smoke. It waits for the app's isolated redeploy to
# reach Vercel `readyState: READY`, then calls `e2e.yml` as a REUSABLE workflow
# (`smoke` job below) with that deployment's own URL. This replaces the old
# `deployment_status`-triggered e2e.yml, which could not self-validate on its
# own PR (deployment_status only fires from the default branch) and which fired
# twice per commit (pre-isolation build + isolated redeploy), racing to
# distinguish them via a `/health` poll. Now there is exactly one smoke
# invocation, against a URL this workflow itself confirmed is READY, running on
# the PR that made the change — see `docs/adr/0047-preview-data-isolation.md`
# for the full history.
#
# Needs secrets: NEON_API_KEY, VERCEL_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_APP_ACCESS_KEY_ID,
# R2_APP_SECRET_ACCESS_KEY. Vars: NEON_PROJECT_ID.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_API: https://console.neon.tech/api/v2
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  VERCEL_API: https://api.vercel.com
  # The Vercel team slug works as the API `teamId` param (verified). IDs live in
  # repo variables like NEON_PROJECT_ID, not hardcoded.
  VERCEL_TEAM: ${{ vars.VERCEL_TEAM_ID }}
  APP_PROJECT: ${{ vars.VERCEL_APP_PROJECT_ID }}
  VIEW_PROJECT: ${{ vars.VERCEL_VIEW_PROJECT_ID }}
  GH_REPO_ID: ${{ vars.GH_REPO_ID }}
  R2_BUCKET: arp-reports-prod
  PR: ${{ github.event.pull_request.number }}
  BRANCH_REF: ${{ github.event.pull_request.head.ref }}
  NEON_BRANCH: preview-pr-${{ github.event.pull_request.number }}

jobs:
  # ── Provision: fork a Neon branch + inject the per-PR env, then redeploy ──────
  isolate:
    if: github.event.action != 'closed'
    name: Isolate preview data plane
    runs-on: ubuntu-latest
    outputs:
      # Stable branch-alias URL of the isolated app-preview deployment (not the
      # immutable per-deploy URL) — consumed by the `smoke` job to invoke
      # e2e.yml with a live target. It is the app's VIEW_ORIGIN-carrying
      # deployment after the second redeploy (issue #307).
      app_url: ${{ steps.redeploy.outputs.app_url }}
      # Stable branch-alias URL of the isolated view-preview deployment — the
      # origin the e2e browser sits on, which the app's VIEW_ORIGIN names
      # exactly so the cross-origin Save passes CORS. Consumed by the `smoke`
      # job (tests/e2e/smoke/editor-auth.feature + toolbar-formatting.feature).
      view_url: ${{ steps.redeploy.outputs.view_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack + pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10.5.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Create or reuse the per-PR Neon branch
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          # Reuse the branch across pushes within a PR (data persists); create on first push.
          branch_id=$(curl -sf "$NEON_API/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            | jq -r --arg n "$NEON_BRANCH" '.branches[] | select(.name == $n) | .id' | head -n1)

          if [ -z "$branch_id" ]; then
            resp=$(curl -s -w $'\n%{http_code}' -X POST "$NEON_API/projects/$NEON_PROJECT_ID/branches" \
              -H "Authorization: Bearer $NEON_API_KEY" -H "Content-Type: application/json" \
              -d "{\"branch\":{\"name\":\"$NEON_BRANCH\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
            code=$(printf '%s' "$resp" | tail -n1); body=$(printf '%s' "$resp" | sed '$d')
            [ "$code" = "200" ] || [ "$code" = "201" ] || { echo "::error::Neon branch create HTTP $code"; echo "$body"; exit 1; }
            branch_id=$(printf '%s' "$body" | jq -r '.branch.id // empty')
            echo "created Neon branch $NEON_BRANCH ($branch_id)"
          else
            echo "reusing Neon branch $NEON_BRANCH ($branch_id)"
          fi
          [ -n "$branch_id" ] || { echo "::error::no branch id"; exit 1; }

          # Discover db + owning role, then fetch the connection URI (holds a password — masked).
          meta=$(curl -sf "$NEON_API/projects/$NEON_PROJECT_ID/branches/$branch_id/databases" \
            -H "Authorization: Bearer $NEON_API_KEY")
          db_name=$(printf '%s' "$meta" | jq -r '.databases[0].name // empty')
          role_name=$(printf '%s' "$meta" | jq -r '.databases[0].owner_name // empty')
          [ -n "$db_name" ] && [ -n "$role_name" ] || { echo "::error::branch has no db/role"; exit 1; }

          uri=""
          for a in 1 2 3 4; do
            u=$(curl -s -w $'\n%{http_code}' -G "$NEON_API/projects/$NEON_PROJECT_ID/connection_uri" \
              -H "Authorization: Bearer $NEON_API_KEY" \
              --data-urlencode "branch_id=$branch_id" --data-urlencode "database_name=$db_name" \
              --data-urlencode "role_name=$role_name" --data-urlencode "pooled=true")
            [ "$(printf '%s' "$u" | tail -n1)" = "200" ] && uri=$(printf '%s' "$u" | sed '$d' | jq -r '.uri // empty') && [ -n "$uri" ] && break
            sleep 3
          done
          [ -n "$uri" ] || { echo "::error::could not fetch connection URI for $branch_id"; exit 1; }
          echo "::add-mask::$uri"
          echo "database_url=$uri" >> "$GITHUB_OUTPUT"

      - name: Apply this PR's migrations to the branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.database_url }}
        # The branch is forked from prod head (prod's schema). The PR's code may
        # add migrations prod doesn't have yet, so apply the PR's full set here —
        # otherwise a schema-changing PR's preview runs against a stale schema.
        # drizzle-kit migrate is idempotent (tracks applied), so this is a no-op
        # for PRs that touch no migrations.
        run: pnpm --filter arp-db run db:migrate

      - name: Inject branch-scoped Vercel env on both projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ steps.branch.outputs.database_url }}
          # Key material for this PR's scan-drain secret — see the derivation
          # below. An EXISTING CI-only secret that both this job and e2e.yml
          # already hold, so making the drain drivable needs no new repo secret
          # and no operator action.
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # Upsert a git-branch-scoped env var (target=preview, gitBranch=this PR's ref).
          # upsert=true makes re-runs idempotent. Values are encrypted by Vercel.
          set_env() {
            local proj="$1" key="$2" val="$3"
            local resp code
            resp=$(curl -s -w $'\n%{http_code}' -X POST \
              "$VERCEL_API/v10/projects/$proj/env?upsert=true&teamId=$VERCEL_TEAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg k "$key" --arg v "$val" --arg b "$BRANCH_REF" \
                  '{key:$k,value:$v,type:"encrypted",target:["preview"],gitBranch:$b}')")
            code=$(printf '%s' "$resp" | tail -n1)
            case "$code" in 200|201) echo "  set $key on $proj";; *) echo "::error::set $key on $proj → HTTP $code"; printf '%s' "$resp" | sed '$d'; return 1;; esac
          }
          # ── Per-PR scan-drain secret (ADR-0045; unblocks the editor-auth
          # second hop — ADR-0080) ──────────────────────────────────────────
          #
          # WHY IT EXISTS. Cloudflare's scan-cron Worker only targets PROD, so
          # nothing ever drives POST /internal/scan-drain on a preview: an
          # uploaded report stays `scan_status: pending` forever, is never
          # servable, and the `/edit` cookie hop can therefore only ever
          # redirect. That is why the editor-auth scenario stopped at the 303 —
          # across TWO production incidents (#188, and the ADR-0080 owner
          # lockout), both of which happened on the hop it could not reach.
          #
          # WHY DERIVED, NOT PASSED. Terraform already provisions a
          # SCAN_DRAIN_SECRET on the `preview` target, but CI cannot know its
          # value — it lives in the prod Terraform state. A job OUTPUT cannot
          # carry a freshly generated one either: the runner redacts registered
          # secrets out of job outputs, so a masked random value would reach the
          # smoke job empty. Both jobs therefore DERIVE the same value
          # independently — HMAC-SHA256 over this PR's branch ref, keyed by a
          # secret they both already hold. e2e.yml computes the identical
          # expression; if the two ever drift, the drain answers 401 and the
          # scenario fails loudly instead of skipping.
          #
          # SCOPE. Branch-scoped, so it overrides the Terraform-provisioned
          # value for THIS PR's previews only and never touches production. It
          # authorizes exactly one thing: draining scan jobs on an ephemeral
          # preview whose database is an isolated Neon branch. Teardown deletes
          # it along with every other gitBranch-scoped var on PR close.
          drain_secret=$(printf '%s' "$BRANCH_REF" \
            | openssl dgst -sha256 -hmac "$BYPASS_SECRET" -r | cut -d' ' -f1)
          echo "::add-mask::$drain_secret"

          for proj in "$APP_PROJECT" "$VIEW_PROJECT"; do
            set_env "$proj" DATABASE_URL "$DATABASE_URL"
            set_env "$proj" SCAN_QUEUE_DATABASE_URL "$DATABASE_URL"
            set_env "$proj" R2_KEY_PREFIX "pr-$PR/"
            # Explicit isolation marker (issue #149): the app's /health route
            # echoes this, and the `smoke` job's e2e.yml call polls /health as a
            # defensive confirmation that the URL it was handed (the redeploy
            # below, already waited to readyState:READY) is genuinely the
            # isolated deployment — belt-and-braces, since trigger inversion
            # (2026-07-09) means e2e.yml is only ever invoked with THIS
            # deployment's URL, not raced against the pre-isolation build.
            # Same branch name already computed above for the Neon branch itself
            # ($NEON_BRANCH, workflow-level env).
            set_env "$proj" NEON_BRANCH "$NEON_BRANCH"
            # Set on BOTH projects so the pair stays symmetrical, even though
            # only the app serves /internal/scan-drain.
            set_env "$proj" SCAN_DRAIN_SECRET "$drain_secret"
          done

      - name: Redeploy previews so the isolated env takes effect
        id: redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Cross-origin editor previews (issue #187 owner-lockout coverage +
        # issue #307 Save round-trip). The two preview deployments talk to each
        # other across origins: the VIEW's editor bundle calls the APP's API
        # (APP_ORIGIN), and the APP's CORS allow-list must name the VIEW's
        # origin exactly (VIEW_ORIGIN, ADR-0063 — echoed byte-for-byte, never
        # `*`, fail-closed when unset). Terraform wires both prod-only; on
        # previews we wire them here to each other's STABLE branch alias
        # (<project>-git-<branch>-<team>.vercel.app), which survives redeploys,
        # rather than the immutable per-deploy `.url`, which does not.
        #
        # Order (three deploys, because each side bakes the other's origin at
        # build and the view's origin is only known after it deploys):
        #   (a) redeploy+wait the APP, capture its stable alias
        #   (b) set the VIEW's APP_ORIGIN to the app alias
        #   (c) redeploy+wait the VIEW, capture its stable alias
        #   (d) set the APP's VIEW_ORIGIN to the view alias
        #   (e) redeploy+wait the APP again so it serves with VIEW_ORIGIN set —
        #       its alias (already the view's APP_ORIGIN) now points here, so
        #       the pair is consistent and the cross-origin browser Save passes.
        # A 2-deploy variant (compute the view alias up front and set
        # VIEW_ORIGIN before the app's first deploy) is possible but relies on
        # reproducing Vercel's alias slug/truncation + team-slug rules; the
        # extra app deploy buys robustness for any branch name. See ADR-0085.
        #
        # VIEW_ACCESS_TOKEN_SECRET is already shared across both projects on
        # previews (one random_password, target=[production,preview]), so the
        # edit-token HMAC verifies once the pair lands — and if the deployed
        # secrets ever drift apart, the view render fails and the e2e catches it
        # (tests/e2e/smoke/editor-auth.feature). With VIEW_ORIGIN now set, the
        # app's /open redirect resolves to the real view alias too, but the
        # e2e still lifts `et=` and navigates directly for determinism.
        run: |
          set -euo pipefail
          # On success, prints the response BODY to stdout. On failure, logs
          # ::error:: + the body to stderr and returns non-zero. Shared by the
          # app and view redeploy calls below (both are now captured+polled).
          redeploy() {
            local proj="$1" name="$2" resp code body
            resp=$(curl -s -w $'\n%{http_code}' -X POST \
              "$VERCEL_API/v13/deployments?teamId=$VERCEL_TEAM&forceNew=1&skipAutoDetectionConfirmation=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg n "$name" --arg ref "$BRANCH_REF" --argjson rid "$GH_REPO_ID" \
                  '{name:$n,project:$n,gitSource:{type:"github",repoId:$rid,ref:$ref}}')")
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            case "$code" in
              200|201) printf '%s' "$body";;
              *) echo "::error::redeploy $name → HTTP $code" >&2; printf '%s' "$body" >&2; return 1;;
            esac
          }

          # Poll Vercel's own deployment record until it's actually serving
          # (readyState: READY), not just accepted for build. Bounded to ~5
          # minutes (60 tries * 5s) each; a build error fails fast instead of
          # exhausting the window. Shared by the app and view waits below.
          wait_ready() {
            local id="$1" name="$2" tries=60 interval=5 state="UNKNOWN" resp
            for i in $(seq 1 "$tries"); do
              # Tolerate a transient API blip (429/5xx): fall back to UNKNOWN
              # and retry rather than letting a single failed GET kill the
              # whole job under `set -euo pipefail`. Only a definitive
              # ERROR/CANCELED, or exhausting the window, fails loud.
              resp=$(curl -sf -m 10 "$VERCEL_API/v13/deployments/$id?teamId=$VERCEL_TEAM" \
                -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || true)
              state=$(printf '%s' "$resp" | jq -r '.readyState // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)
              case "$state" in
                READY) return 0 ;;
                ERROR|CANCELED) echo "::error::$name deployment $id reached readyState=$state"; return 1 ;;
                *) sleep "$interval" ;;
              esac
            done
            echo "::error::$name deployment $id did not reach READY within $((tries * interval))s (last readyState: $state)"
            return 1
          }

          # Same git-branch-scoped upsert as the "Inject branch-scoped Vercel
          # env" step above — bash functions don't cross step boundaries, so
          # it's redefined verbatim here rather than shared. Used below to set
          # APP_ORIGIN on the view AND VIEW_ORIGIN on the app, each to the
          # OTHER's stable branch alias (issue #307).
          set_env() {
            local proj="$1" key="$2" val="$3"
            local resp code
            resp=$(curl -s -w $'\n%{http_code}' -X POST \
              "$VERCEL_API/v10/projects/$proj/env?upsert=true&teamId=$VERCEL_TEAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg k "$key" --arg v "$val" --arg b "$BRANCH_REF" \
                  '{key:$k,value:$v,type:"encrypted",target:["preview"],gitBranch:$b}')")
            code=$(printf '%s' "$resp" | tail -n1)
            case "$code" in 200|201) echo "  set $key on $proj";; *) echo "::error::set $key on $proj → HTTP $code"; printf '%s' "$resp" | sed '$d'; return 1;; esac
          }

          # The deployment's STABLE git-branch alias
          # (<project>-git-<branch>-<team>.vercel.app) — stable across
          # redeploys of the same branch, unlike the immutable per-deploy
          # `.url`. We cross-wire the pair to each other's alias (not their
          # immutable URLs) precisely so the app can be redeployed once more
          # below without invalidating the view's APP_ORIGIN (issue #307).
          # Read from the API rather than hand-slugified: Vercel truncates and
          # hashes long branch names, and the alias also carries the team slug,
          # neither of which the workflow should try to reproduce.
          branch_alias() {
            local id="$1" name="$2" alias
            alias=$(curl -sf -m 10 "$VERCEL_API/v13/deployments/$id?teamId=$VERCEL_TEAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              | jq -r '.meta.branchAlias // .alias[0] // empty' 2>/dev/null || true)
            [ -n "$alias" ] || { echo "::error::$name deployment $id exposed no branch alias — cannot wire cross-origin CORS"; return 1; }
            printf '%s' "$alias"
          }

          # (a) App project: redeploy, wait for READY, then capture its stable
          # branch alias — the origin the VIEW's editor bundle will call.
          app_body=$(redeploy "$APP_PROJECT" arp-app-prod)
          app_id=$(printf '%s' "$app_body" | jq -r '.id // empty')
          app_url=$(printf '%s' "$app_body" | jq -r '.url // empty')
          [ -n "$app_id" ] && [ -n "$app_url" ] || { echo "::error::redeploy arp-app-prod succeeded but the response had no id/url"; exit 1; }
          echo "  redeployed arp-app-prod ($app_id → $app_url)"
          wait_ready "$app_id" arp-app-prod
          app_alias=$(branch_alias "$app_id" arp-app-prod)
          echo "  arp-app-prod deployment $app_id is READY (alias $app_alias)"

          # (b) Point the VIEW project's cross-origin editor bundle at the
          # app's STABLE alias (not the immutable app_url) — so it survives the
          # app's second redeploy in (e). Must happen BEFORE the view's own
          # redeploy below so that build picks it up.
          set_env "$VIEW_PROJECT" APP_ORIGIN "https://$app_alias"

          # (c) View project: redeploy, wait for READY, capture its stable
          # alias — the origin the browser will sit on, which the app's CORS
          # allow-list must name exactly (tests/e2e/smoke/editor-auth.feature +
          # toolbar-formatting.feature).
          view_body=$(redeploy "$VIEW_PROJECT" arp-view-prod)
          view_id=$(printf '%s' "$view_body" | jq -r '.id // empty')
          view_url=$(printf '%s' "$view_body" | jq -r '.url // empty')
          [ -n "$view_id" ] && [ -n "$view_url" ] || { echo "::error::redeploy arp-view-prod succeeded but the response had no id/url"; exit 1; }
          echo "  redeployed arp-view-prod ($view_id → $view_url)"
          wait_ready "$view_id" arp-view-prod
          view_alias=$(branch_alias "$view_id" arp-view-prod)
          echo "  arp-view-prod deployment $view_id is READY (alias $view_alias)"

          # (d) Now the view's stable origin is known, set it as the app's
          # VIEW_ORIGIN — the single exact origin the app's CORS allow-list
          # echoes (ADR-0063; cors.server.ts reads VIEW_ORIGIN per-request,
          # but the value is baked into the deployment at build, so the app
          # must redeploy to see it).
          set_env "$APP_PROJECT" VIEW_ORIGIN "https://$view_alias"

          # (e) Redeploy the app so it serves with VIEW_ORIGIN set. Its stable
          # alias (already the view's APP_ORIGIN from (b)) now resolves to this
          # deployment, so the pair is consistent: browser on view_alias →
          # Save → app_alias, whose VIEW_ORIGIN === view_alias → CORS allows.
          app_body=$(redeploy "$APP_PROJECT" arp-app-prod)
          app_id=$(printf '%s' "$app_body" | jq -r '.id // empty')
          [ -n "$app_id" ] || { echo "::error::second redeploy of arp-app-prod had no id"; exit 1; }
          echo "  redeployed arp-app-prod for VIEW_ORIGIN ($app_id)"
          wait_ready "$app_id" arp-app-prod
          echo "  arp-app-prod deployment $app_id is READY with VIEW_ORIGIN=https://$view_alias"

          echo "Preview PR #$PR isolated on Neon branch $NEON_BRANCH + R2 prefix pr-$PR/"

          # Emit the STABLE aliases (not immutable per-deploy URLs): the browser
          # Origin the e2e sits on must equal the app's VIEW_ORIGIN byte for
          # byte, and both sides of the pair reference each other by alias.
          echo "app_url=https://$app_alias" >> "$GITHUB_OUTPUT"
          echo "view_url=https://$view_alias" >> "$GITHUB_OUTPUT"

  # ── Smoke: run the e2e reusable workflow against the now-READY isolated URL ───
  #
  # SHARED CONCURRENCY, SCOPED TO THE SMOKE LEG ONLY (issue #266, 2nd comment).
  # Every PR's smoke authenticates against the SAME Clerk dev instance and
  # provisions run-scoped identities into the SAME anchored `agranado.com` org.
  # Three stacked PRs pushing at once ran three suites in parallel and the
  # instance answered `clerk users lookup failed: 429`. The `isolate` /
  # `security-headers` / `teardown` jobs contend for nothing shared (their Neon
  # branch, Vercel env and R2 prefix are all per-PR), so the group goes HERE,
  # on the one job that touches a shared external resource — the workflow-level
  # `concurrency` above stays per-PR, and nothing else is serialized.
  #
  # `cancel-in-progress: false` because a half-run smoke leaks fixtures: the
  # global teardown only runs when the process is allowed to finish.
  #
  # KNOWN LIMIT: GitHub keeps at most ONE pending run per concurrency group —
  # "any existing pending job or workflow in the same concurrency group will be
  # canceled and the new queued job will take its place". So with three PRs
  # arriving together, the first runs, the second waits, and the third EVICTS
  # the second. That is a cancelled required check needing a re-run, which is
  # visible and one click to fix — traded against a 429 mid-suite, which is a
  # red herring failure that also leaks the fixtures it had already created.
  smoke:
    needs: isolate
    if: github.event.action != 'closed'
    name: Smoke the isolated preview
    concurrency:
      group: preview-smoke-shared
      cancel-in-progress: false
    uses: ./.github/workflows/e2e.yml
    with:
      base_url: ${{ needs.isolate.outputs.app_url }}
      view_base_url: ${{ needs.isolate.outputs.view_url }}
      head_sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  # ── Security headers: assert what the EDGE serves matches the source ─────────
  # The `security-headers` gate docs/spec.html's CI table has always promised
  # (ADR-013). Invoked from here for the same reason as `smoke` above: this
  # workflow is the only place that knows which deployment is the isolated,
  # READY one, and a `workflow_call` job runs in the PR's own context so a
  # change to the gate is exercised by the PR that makes it.
  security-headers:
    needs: isolate
    if: github.event.action != 'closed'
    name: Security headers
    uses: ./.github/workflows/security-headers.yml
    with:
      view_base_url: ${{ needs.isolate.outputs.view_url }}

  # ── Teardown: delete the branch, env vars, and R2 objects on PR close ─────────
  teardown:
    if: github.event.action == 'closed'
    name: Tear down preview data plane
    runs-on: ubuntu-latest
    steps:
      - name: Delete the per-PR Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          for id in $(curl -sf "$NEON_API/projects/$NEON_PROJECT_ID/branches" \
              -H "Authorization: Bearer $NEON_API_KEY" \
              | jq -r --arg n "$NEON_BRANCH" '.branches[] | select(.name == $n) | .id'); do
            curl -sf -X DELETE "$NEON_API/projects/$NEON_PROJECT_ID/branches/$id" \
              -H "Authorization: Bearer $NEON_API_KEY" >/dev/null && echo "deleted Neon branch $id" \
              || echo "::warning::failed to delete Neon branch $id — sweep manually"
          done

      - name: Remove the branch-scoped Vercel env vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for proj in "$APP_PROJECT" "$VIEW_PROJECT"; do
            ids=$(curl -sf "$VERCEL_API/v9/projects/$proj/env?teamId=$VERCEL_TEAM" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              | jq -r --arg b "$BRANCH_REF" '.envs[] | select(.gitBranch == $b) | .id')
            for id in $ids; do
              curl -sf -X DELETE "$VERCEL_API/v9/projects/$proj/env/$id?teamId=$VERCEL_TEAM" \
                -H "Authorization: Bearer $VERCEL_TOKEN" >/dev/null && echo "deleted env $id on $proj" \
                || echo "::warning::failed to delete env $id on $proj"
            done
          done

      - name: Delete the preview's R2 objects (pr-<N>/ prefix)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_APP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_APP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Tightly scoped: only ever deletes under the pr-<N>/ prefix, never prod keys.
          aws s3 rm "s3://$R2_BUCKET/pr-$PR/" --recursive \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            && echo "deleted R2 objects under pr-$PR/" \
            || echo "::warning::R2 cleanup under pr-$PR/ failed — sweep manually"
