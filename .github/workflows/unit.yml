name: Unit tests

# Runs the Vitest unit suite (ADR-0042) on every PR. Pure domain/application
# packages need no infrastructure, so this is a fast, hermetic gate that
# complements the infrastructure-first e2e tests (ADR-019).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack + pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10.5.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Typecheck the WHOLE workspace — apps as well as packages. The
      # `./packages/*` filter here once let an app-tier type error stay green
      # (vitest strips types, so an app test with a type error still runs), which
      # is exactly how a broken `mount()` helper in apps/view reached main under a
      # green suite (issue #308). `turbo typecheck` runs the task in every
      # workspace that defines one, apps included.
      - name: Typecheck (apps + packages)
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm test

      # Self-tests for the review-assist shell scripts (scripts/*.sh). They read
      # real git history, so their fixtures are real throwaway repositories —
      # dependency-free node:test, same tier as the docs-conformance harness
      # self-tests, just a different subject.
      - name: Review-script self-tests
        run: pnpm test:scripts

      # THE AUTHORITATIVE "every step is defined" CHECK, and it belongs in the
      # fast gate because it needs nothing but the repo: `bddgen` generates a
      # Playwright spec per opted-in .feature and ERRORS on any step with no
      # definition. Without it, an undefined step in a feature listed in
      # playwright.config.ts's `features` array would only be discovered by the
      # e2e job, i.e. after a preview deploy — or not at all, if the e2e job
      # were skipped.
      #
      # It is the enforcement half of docs-conformance's `feature-executes`
      # validator (which checks the cheap file-level facts: listed in the array,
      # a `<slug>.steps.ts` beside it, no @wip). Together they are what stops a
      # `.feature` file claiming coverage it does not have — the state the
      # corpus was in when 33 files existed and 1 of them ran.
      - name: BDD step definitions all resolve
        run: pnpm e2e:gen

  # Component-level BROWSER tests for packages/editor (ADR-0062 Amendment 3).
  # Hermetic — a file:// harness page bundling the real ReportEditor, no
  # deployment, no Clerk credentials, no database — so it belongs in this fast
  # gate rather than the infrastructure-first e2e workflow. It exists because
  # the in-page anchor scroll shipped inert under a fully green unit suite: the
  # bug was an ordering fact about a real browser and a mounted ProseMirror,
  # which no node-tier test can observe.
  browser:
    name: Editor browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack + pnpm 10
        run: |
          corepack enable
          corepack prepare pnpm@10.5.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser
